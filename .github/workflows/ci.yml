name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:secrets
      - run: npm run public:audit
      - run: npm run runtime:build
      - run: npm run check
      - run: npm run reference:audit
      - run: npm run audit:gate-self-test
      - run: npm run build

  rrs-offline-pytest:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Recording Retrieval Service test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tools/recording-retrieval-service/app[dev]"
      - name: Compile check (RRS)
        run: python -m compileall -q tools/recording-retrieval-service/app/app
      - name: Offline pytest (RRS, network tests excluded)
        working-directory: tools/recording-retrieval-service/app
        run: python -m pytest -m "not network" -q

  windows-package:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run bootstrap:windows
      - run: npm run doctor:windows
      - run: npm run check
      - run: npm run build
      - run: npm run package:windows
      - name: Verify installer payload (unsigned candidate; execution requires signing)
        shell: pwsh
        run: |
          $installer = Get-ChildItem output/releases/buquanshu-setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer not found" }
          ./scripts/windows/ci-verify-installer-payload.ps1 -InstallerPath $installer.FullName
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.run_id }}
          path: |
            output/releases/*.exe
            output/releases/*.blockmap
            output/releases/latest*.yml
          if-no-files-found: error
          retention-days: 14

  windows-release:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-preview.')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run bootstrap:windows
      - run: npm run doctor:windows
      - run: npm run check
      - run: npm run build
      # Build the signed installer WITHOUT publishing. Gate order matters:
      # build -> signature/install smoke -> audit/checksums -> publish.
      - run: npm run desktop:dist:signed
      - name: Verify Authenticode signature (official release gate)
        shell: pwsh
        run: |
          $installer = Get-ChildItem output/releases/buquanshu-setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer not found" }
          ./scripts/verify-release-signing.ps1 -InstallerPath $installer.FullName -RequireSigned
      - name: Installer install smoke (signed release)
        shell: pwsh
        run: |
          $installer = Get-ChildItem output/releases/buquanshu-setup-*.exe | Select-Object -First 1
          ./scripts/windows/ci-install-smoke.ps1 -InstallerPath $installer.FullName
      - name: Release audit and checksums
        shell: pwsh
        run: |
          npm run audit:release
          npm run release:checksums
      - name: Publish GitHub Release (after all gates)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --generate-notes --verify-tag }
          $assets = @(Get-ChildItem output/releases/buquanshu-setup-*.exe, output/releases/*.blockmap, output/releases/latest.yml)
          gh release upload $tag @($assets.FullName) --clobber
