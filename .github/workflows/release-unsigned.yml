name: Unsigned Stable Release (manual exception)

# One-time/manual release path for a stable version when no code-signing
# certificate is available. It must be started explicitly and requires the
# operator to type UNSIGNED. The normal signed tag workflow remains the
# default; set the repository variable ALLOW_UNSIGNED_RELEASE=true before
# pushing the tag, then set it back to false after the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.2"
        required: true
        type: string
      confirmation:
        description: "Type UNSIGNED to confirm this is an unsigned release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  unsigned-release:
    if: github.event.inputs.confirmation == 'UNSIGNED' && startsWith(github.event.inputs.tag, 'v')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm run bootstrap:windows
      - run: npm run doctor:windows
      - run: npm run check
      - run: npm run build
      - run: npm run package:windows

      - name: Verify unsigned installer payload
        shell: pwsh
        run: |
          $installer = Get-ChildItem output/releases/buquanshu-setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer not found" }
          ./scripts/windows/ci-verify-installer-payload.ps1 -InstallerPath $installer.FullName
          npm run audit:release
          npm run release:checksums

      - name: Create normal stable GitHub Release (unsigned exception)
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $title = "不全书 0.1.2"
          $notes = "docs/release/0.1.2-release-notes.md"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes-file $notes --latest --verify-tag
          } else {
            gh release edit $tag --title $title --notes-file $notes --latest
          }
          $assets = @(
            Get-ChildItem output/releases/buquanshu-setup-*.exe,
            output/releases/buquanshu-setup-*.exe.blockmap,
            output/releases/latest.yml,
            output/releases/SHA256SUMS.txt,
            output/releases/checksums.json,
            tools/recording-retrieval-service/app/dist/recording-retrieval-service-portable-*.zip,
            tools/recording-retrieval-service/app/dist/recording-retrieval-service-portable-*.zip.build-info.json,
            SBOM.md,
            THIRD_PARTY_NOTICES.md,
            LICENSE,
            NOTICE
          ) | Where-Object { Test-Path -LiteralPath $_.FullName }
          gh release upload $tag @($assets.FullName) --clobber
          Write-Host "UNSIGNED_STABLE_RELEASE=$tag assets=$($assets.Count)"
